<!DOCTYPE html>
<html lang="de">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<title>Einkaufsliste</title>
	<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
	<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="default">
	<meta name="apple-mobile-web-app-title" content="Einkauf">
	<link rel="apple-touch-icon" href="icons/icon-180.png">
	<link rel="manifest" href="manifest.webmanifest">
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<header>
		<h1>Einkaufsliste</h1>
		<p id="summary"></p>
	</header>

	<form id="addForm" autocomplete="off">
		<input id="userinput" type="text" placeholder="Artikel hinzufügen …" enterkeyhint="done" aria-label="Neuer Artikel">
		<button id="enter" type="submit" aria-label="Hinzufügen">+</button>
	</form>

	<ul id="list"></ul>
	<p id="empty">Deine Liste ist leer.</p>

	<button id="clearDone" type="button">Erledigte löschen</button>

	<script src="script.js"></script>
</body>
</html>
